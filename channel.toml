# Blue Ocean Marketing - channel settings used by the studio tool.

[channel]
name = "Blue Ocean Marketing"
niche = "Practical, low-budget marketing playbooks for every kind of small business: restaurants, cafes, salons, gyms, contractors, clinics, retail shops, e-commerce stores, real estate agents, local services and solo professionals."
audience = "Small business owners in English-speaking countries who do their own marketing with little time and money."
cta = "Want us to look at your marketing for free? Get a free audit from Blue Ocean Marketing, link in the description."
follow_line = "Follow Blue Ocean Marketing for one marketing fix every day."

[brand]
primary = "#0A6A8A"
accent = "#F2A93B"
dark = "#0C151B"
light = "#F4F6F7"
font_bold = "C:/Windows/Fonts/segoeuib.ttf"
font_regular = "C:/Windows/Fonts/segoeui.ttf"
caption_font = "Segoe UI"

[llm]
# Cheap model is plenty for scripts. Change here if OpenAI renames it.
model = "gpt-5-mini"
# Less hidden "thinking" = cheaper scripts. Remove this line for models without reasoning.
reasoning_effort = "low"

[voice]
# "clone"  = your own voice (StyleTTS2), cloned from your private sample. Runs on GitHub
#            (needs the VOICE_REPO_PAT secret); falls back to `fallback_provider` on the PC.
# "edge"   = free Microsoft neural voices
# "openai" = OpenAI TTS, about $0.015 per minute of audio
provider = "clone"
fallback_provider = "edge"
clone_repo = "oceanfarm1992-design/voice-reference-audio"
clone_file = "reference_voice.mp3"
# Speaking style from profile.json in the voice repo: default, talking, comedy or
# presentation (facts narration, stronger delivery).
clone_style = "presentation"
# RVC voice conversion from the voice repo: "off" (default), "auto" or "on". It needs an
# Applio checkout (APPLIO_DIR) that GitHub runners do not have, so it stays off for now.
clone_rvc = "off"
edge_voice = "en-US-AndrewNeural"
edge_rate = "+4%"
openai_model = "gpt-4o-mini-tts"
openai_voice = "onyx"

[publish]
# Where every video goes. YouTube uploads directly through its own API (long videos and
# Shorts); the rest go through Buffer (free plan: 3 channels). Instagram gets Shorts only,
# because long videos are landscape.
services = ["youtube", "facebook", "linkedin", "instagram"]
# YouTube category 27 = Education (others: 22 People & Blogs, 26 Howto & Style)
youtube_category = "27"
youtube_privacy = "public"
# Times you type (and weekly schedule times) are in this time zone. Asia/Dubai = UTC+4.
timezone = "Asia/Dubai"
# Weekly schedule, local time. 18:00 Dubai = 15:00 London = 10:00 New York.
long_time = "18:00"
short_time = "19:00"
# false = weekly batch lands in Buffer as dated drafts you approve; true = schedule directly.
auto_schedule = true
# Set true if a video shows realistic AI-generated people, places or events.
disclose_ai = false
max_hashtags = 5

[video]
fps = 30
long_size = [1920, 1080]
short_size = [1080, 1920]
long_minutes = 8
short_seconds = 50
# Seconds of footage before cutting to the next stock clip
long_clip_seconds = 6.0
short_clip_seconds = 3.5
# Let the script model look at each stock clip's preview and skip unrelated footage
# (a fraction of a cent per video). Needs the OpenAI key.
check_stock_with_ai = true

[doodle]
# Whiteboard doodle scenes: an AI line drawing that a hand draws on screen.
# "mix" = the script writer picks doodle or stock footage per scene (ideas, offers, steps
#         become doodles; real people doing real things stay stock footage)
# "all" = every scene is a doodle   "off" = stock footage only
mode = "mix"
image_model = "gpt-image-1"
# low ~$0.016, medium ~$0.063, high ~$0.25 per drawing. Drawings are cached per prompt,
# so Shorts cut from the long video reuse its drawings for free.
quality = "low"
# Python clean-up that makes low-quality drawings crisp: solid marker lines, no grey haze
# or smudges, one consistent blue accent.
enhance = true
# AI look at each finished drawing (~$0.0003); writing or a smeared face gets one redraw.
review = true
max_attempts = 2
# Pace: doodle scenes follow the voice (drawing done by 75% of the line, no silent wait).
# Very short lines last at least min_scene_seconds; hold_seconds is the gap before the cut.
min_scene_seconds = 3.0
hold_seconds = 0.2
max_draw_seconds = 10.0
# Skip stock clips whose Pexels title shares no words with the search, and draw a doodle
# when nothing relevant is left (instead of a plain text card).
replace_weak_stock = true
