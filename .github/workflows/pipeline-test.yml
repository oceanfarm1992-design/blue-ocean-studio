# Manual end-to-end test. Writes scripts, renders a full week and previews publishing.
# It posts NOTHING, commits nothing, and saves the videos as a downloadable artifact.
name: Pipeline test (posts nothing)

on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional topic focus, e.g. restaurants"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # your cloned voice renders at roughly 4x real time on CPU
    env:
      # Secret names match .env.txt and youtube.env
      OPENAI_API_KEY: ${{ secrets.OPEN_AI_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      VOICE_REPO_PAT: ${{ secrets.VOICE_REPO_PAT }}
      FOCUS: ${{ github.event.inputs.focus }}
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg, fonts and espeak-ng (voice phonemes)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core espeak-ng
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python packages (CPU torch first, then your voice engine)
        run: |
          pip install torch==2.8.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-cloud.txt

      - name: 1. Unit tests
        run: python -m pytest -q

      - name: 2. Check every service connection
        continue-on-error: true   # e.g. Buffer's daily request limit must not stop the render test
        run: python -m studio check

      - name: 3. Write this week's scripts
        run: python -m studio week plan --focus "$FOCUS"

      - name: 4. Render the long video and 7 Shorts
        run: |
          batch=$(ls projects/weeks/*.json | sort | tail -1)
          echo "BATCH=$batch" >> "$GITHUB_ENV"
          python -m studio week build "$batch" --force

      - name: 5. Preview publishing (nothing is posted)
        continue-on-error: true
        run: python -m studio week schedule "$BATCH" --schedule --dry-run

      - name: 6. Save videos for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-week-videos
          retention-days: 3
          path: |
            projects/**/video.mp4
            projects/**/thumbnail.jpg
            projects/**/script.md
            projects/**/upload.txt
