# After the weekly review pull request is merged: render the week and send it to Buffer.
# With auto_schedule = false in channel.toml, posts arrive as dated DRAFTS that the
# owner approves in Buffer before anything is published.
name: Week 2 - build and send to Buffer

on:
  push:
    branches: [main]
    paths:
      - "projects/**/script.json"
      - "projects/weeks/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: week-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # Secret names match .env.txt, uploaded with: gh secret set -f .env.txt
      OPENAI_API_KEY: ${{ secrets.OPEN_AI_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      # Long videos go straight to YouTube (uploaded with: gh secret set -f youtube.env)
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      # Read-only token for the private repo holding your voice sample
      VOICE_REPO_PAT: ${{ secrets.VOICE_REPO_PAT }}
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg, fonts and espeak-ng (voice phonemes)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core espeak-ng
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python packages (CPU torch first, then your voice engine)
        run: |
          pip install torch==2.8.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-cloud.txt

      - name: Render and send to Buffer
        run: python -m studio week auto

      - name: Save records back to the repository
        if: always()
        run: |
          git config user.name "blue-ocean-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record week sent to Buffer"
          git pull --rebase
          git push
