# Daily: delete hosted videos from Cloudinary once Buffer has posted them (keeps it free).
name: Daily cleanup

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC = 06:00 Dubai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Secret names match .env.txt, uploaded with: gh secret set -f .env.txt
      BUFFER_API_KEY: ${{ secrets.BUFFER_API }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m studio cleanup
      - name: Save records
        run: |
          git config user.name "blue-ocean-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: cleanup hosted videos"
          git pull --rebase
          git push
